# Hermes Advise v1.1 Cooldown Log
#
# Internal version: hermes-advise-v1.1-stability-green
# Purpose: manual field notes from real operator use.
#
# Rules:
# - Do not automate this file yet.
# - Do not treat this as persistent audit evidence.
# - Record real lab usage, not demos.
# - Focus especially on missing_expected_recommendation.

cooldown:
  status: active
  target_duration: 1_to_2_weeks
  target_requests: 20_to_50
  constraints:
    no_new_rules: true
    no_observe_implementation: true
    no_act_implementation: true
    no_llm_integration: true
    no_run_engine_integration: true
    no_main_navigation_entry: true

manual_metrics_totals:
  advise_usage:
    total_requests: 0
    unique_experiment_types: []
    recommendations_per_request: []
    empty_responses: 0
  trust_signals:
    accepted_recommendations: 0
    ignored_recommendations: 0
    disputed_recommendations: 0
  recommendation_quality:
    useful: 0
    obvious_but_correct: 0
    noisy: 0
    wrong: 0
    missing_expected_recommendation: 0

